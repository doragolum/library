*{box-sizing:border-box}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
html{overflow-x:hidden;overscroll-behavior-x:none}
body{margin:0;overflow-x:clip;overscroll-behavior-x:none;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:center;gap:8px;padding:10px 16px 4px}
.top h1{font:600 20px var(--head);margin:0;flex:1}.top h1 .logo{width:26px;height:26px;vertical-align:-5px;margin-right:6px}
h2,h3,.hello{font-family:var(--head);font-weight:600}
.addbtn{border:0;background:var(--accent-fill);color:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:6px 12px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:999px;font:inherit;white-space:nowrap;cursor:pointer;text-align:left}
.tab.on{background:var(--accent-fill);color:#fff}
main{max-width:980px;margin:0 auto;padding:14px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;min-width:0}
h2{font-size:16px;margin:4px 0 10px}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;font:inherit;color:inherit}
.tile b{display:block;font-size:20px}
.tiles.sm{grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}
button.tile{cursor:pointer}
button.tile:hover{border-color:var(--accent)}
button.tile::after{content:"›";float:right;color:var(--muted);margin-top:-30px;font-size:16px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--field);border-radius:10px;padding:9px 11px}
@media (max-width:700px){input,select,textarea{font-size:16px}}
input[type=search],select,.form input,.form select{width:100%}
input[type=search]{font-size:16px}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.sbox{position:relative;display:block;min-width:0}
.sbox input{width:100%;padding-right:40px}
.sclr{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:0}
.sbox input:placeholder-shown+.sclr{display:none}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;min-width:0}
.item:hover{border-color:var(--accent)}
.item .body{flex:1;min-width:0}
.item .pv{margin-left:auto;align-self:center;font-weight:600;white-space:nowrap;padding-left:6px}
.item .t{font-weight:600}
.thumb{width:40px;height:60px;border-radius:4px;object-fit:cover;flex:none;background:var(--line)}
.ph{width:40px;height:60px;border-radius:4px;flex:none;color:#2a2622;font-size:8px;line-height:1.1;padding:4px 3px;overflow:hidden;text-align:center;display:flex;align-items:center;justify-content:center}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--ink);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
.item .body{min-width:0}
.chip.a{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.w{background:var(--warn-soft);color:var(--warn)}
.chip.b{background:var(--bad-soft);color:var(--bad)}
a.chip,button.chip{cursor:pointer;border:0;font:inherit;font-size:12px;text-decoration:none}
.pick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pick button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;min-height:40px;font:inherit;font-size:15px;cursor:pointer}
.pick button.on{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 13px;font:inherit;cursor:pointer}
.btn.p{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hbars .r{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;margin:5px 0;font-size:15px}
.hbars .r span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbars .r .bar{margin:0}
.hbars .r .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
table.kv{width:100%;border-collapse:collapse}
table.kv td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-word}
table.kv td:first-child{color:var(--muted);width:42%;padding-right:10px}
.shelf{font-size:20px;font-weight:700;background:var(--line);color:var(--ink);border-radius:12px;padding:12px 14px;margin:8px 0 12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .sheet{background:var(--card);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 28px}
.modal .sheet.wide{max-width:900px}
.modal .sheet.tall{min-height:min(86vh,calc(100vh - 80px))}
.modal:not(.top) .sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:-8px auto 10px}
.modal.mid{align-items:flex-start;padding:9vh 16px 0}.modal.mid .sheet{border-radius:18px;max-width:420px}
.modal.top{align-items:flex-start}.modal.top .sheet{border-radius:0 0 18px 18px;max-height:85vh;padding-top:12px}
.ebar{position:sticky;bottom:-28px;margin:14px -16px -28px;padding:10px 16px 18px;background:var(--card);border-top:1px solid var(--line);z-index:2}
.ebar .row{gap:8px;align-items:center}.ebar input{min-width:0}
@media (min-width:700px){.modal:not(.top) .sheet::before{display:none}.modal{align-items:center}.modal.top{align-items:flex-start;padding-top:60px}.modal .sheet{border-radius:18px}}
.close{float:right;border:0;background:var(--line);color:var(--ink);border-radius:999px;width:40px;height:40px;font-size:20px;cursor:pointer;margin-left:8px}
.msg{padding:14px;border-radius:12px;background:var(--bad-soft);color:var(--bad)}
.note{padding:10px 12px;border-radius:12px;background:var(--line);color:var(--ink);font-size:15px;margin-bottom:12px}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
.num{font-variant-numeric:tabular-nums}
.edits{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.bstat{margin:0 0 8px}.bstat button{padding:10px 4px;min-height:42px}
.bmore{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--card)}
.bmore summary{display:flex;gap:10px;align-items:center;padding:11px 12px;min-height:44px;box-sizing:border-box;cursor:pointer;list-style:none;font-size:15px}
.bmore summary::-webkit-details-marker{display:none}.bmore[open] summary .link{visibility:hidden}.bmore .edits{padding:0 12px;margin-bottom:12px}
.edit span,.form label>span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(80px);opacity:0;visibility:hidden;pointer-events:none;transition:transform .2s,opacity .2s,visibility .2s;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:15px;z-index:30;transition:transform .2s;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;pointer-events:auto;cursor:pointer}
.toast.bad{background:var(--bad);color:#fff}
.more{display:block;margin:10px auto 0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.stars{display:inline-flex;gap:2px}
.stars button{border:0;background:none;font-size:30px;line-height:1;cursor:pointer;padding:4px 3px;min-width:40px;min-height:40px;color:var(--field)}

.oi-got{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 8px 6px;min-width:64px;font:inherit;font-size:12px;cursor:pointer}.oi-got:hover{border-color:var(--accent);color:var(--accent)}.oi-got.p{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
.grp-h{margin:14px 0 6px;font-size:15px;display:flex;gap:6px;align-items:baseline}.grp-h .muted{font-weight:400}
.pick .sep{width:1px;background:var(--line);margin:0 4px;align-self:stretch}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi .k{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}.kpi .k[data-list],.kpi .k[data-tab]{cursor:pointer}
.kpi .k .e{font-size:20px}.kpi .k b{display:block;font-size:20px;margin-top:2px}.kpi .k span:last-child{font-size:12px;color:var(--muted)}
.vb{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:14px}
.vb .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.vb .c i{display:block;width:70%;max-width:34px;background:linear-gradient(var(--accent),var(--accent-soft));border-radius:6px 6px 2px 2px}
.vb .v{font-size:12px;color:var(--muted);margin-bottom:2px}.vb .l{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap}
.stack{display:flex;height:16px;border-radius:9px;overflow:hidden;gap:2px}.stack i{display:block;cursor:pointer}
.achcard .bar{margin-top:6px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ac{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}.ac.off{opacity:.75}.ac .e{font-size:28px}
.ac .lv{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 6px}.ac .lv span{font-size:12px;border-radius:99px;padding:2px 7px;background:var(--line);color:var(--muted)}
.ac .lv span.on{background:var(--accent-fill);color:#fff}.ac .lv span.nx{border:1.5px dashed var(--accent);color:var(--accent);background:none}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rc{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer}.rc .thumb,.rc .ph{width:44px;height:66px}
.rc .grow>*{display:block}.rc b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rc .v{font-weight:700;color:var(--accent)}
.ordtext{width:100%;min-height:90px;box-sizing:border-box;border:1px solid var(--field);border-radius:12px;padding:10px;font:inherit;font-size:15px;background:var(--card,#fff);color:inherit}
.oitem{position:relative;border:1px solid var(--line,#e5e2dc);border-radius:14px;padding:12px 12px 4px;margin-top:10px}
.oitem .ox{position:absolute;top:0;right:0;width:44px;height:44px;border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer}
.ob{display:inline-block;font-size:12px;border-radius:999px;padding:2px 9px;margin-bottom:6px}

.rvc{display:flex;flex-direction:column;gap:3px;font-size:13px;min-width:0}

.rvc .ob{align-self:flex-start;margin-top:4px}
.rvown{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.rvown .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px}

  function suggestShelf(b) {

    var home = D.books.filter(function (x) { return atHome(x) && !isRead(x); });
    var ser = b.series && home.filter(function (x) { return norm(x.series) === norm(b.series) && x.shelf; });
    if (ser && ser.length) return { shelf: mostCommon(ser, function (x) { return x.shelf; }), why: 'поруч із серією' };
    var au = home.filter(function (x) { return x.author === b.author && x.shelf; });
    if (au.length) return { shelf: mostCommon(au, function (x) { return x.shelf; }), why: 'поруч з автором' };

    var cnt = {};
    home.forEach(function (x) { if (x.shelf && x.genre === b.genre && shelfOpen(x.shelf)) cnt[x.shelf] = (cnt[x.shelf] || 0) + 1; });

  function shrinkImage(file, max) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {

        var c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.88).split(',')[1]);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Не вдалося відкрити картинку')); };

  }

  var CLICKY = '[data-book],[data-wish],[data-list],[data-go],[data-tab],[data-shopen],[data-shjump],[data-action]';
  function makeFocusable(root) {
    if (!root) return;
    root.querySelectorAll(CLICKY).forEach(function (e) {
      if (/^(BUTTON|A|INPUT|SELECT|TEXTAREA|LABEL|OPTION)$/.test(e.tagName) || e.hasAttribute('tabindex')) return;
      if (e.parentElement && e.parentElement.closest(CLICKY) && e.parentElement.closest(CLICKY) !== e && !e.matches('.item,.lst,.hrow,.oline,.rrow,.cov,.fi,.rc,.miss')) return;
      e.setAttribute('tabindex', '0'); e.setAttribute('role', 'button');
    });
  }
  ['app', 'modal'].forEach(function (id) {
    var el = document.getElementById(id);
    if (window.MutationObserver) new MutationObserver(function () { makeFocusable(el); }).observe(el, { childList: true, subtree: true });
  });
  document.addEventListener('keydown', function (ev) {
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target && ev.target.getAttribute && ev.target.getAttribute('role') === 'button' && ev.target.tagName !== 'BUTTON') { ev.preventDefault(); ev.target.click(); }
  });

  var MAIL_TOK = (location.hash.match(/[#&]access_token=([^&]+)/) || [])[1];
  var MAIL_ERR = (location.hash.match(/[#&]error_description=([^&]+)/) || [])[1];
  if (window.LB_DB && !ON_GAS && MAIL_TOK) loginMailFinish(decodeURIComponent(MAIL_TOK));
  else if (window.LB_DB && !ON_GAS && MAIL_ERR) { history.replaceState(null, '', location.pathname); loginScreen('Посилання з листа не спрацювало: воно діє недовго й лише один раз. Надішли новий лист.'); }
  else if (window.LB_DB && !ON_GAS && !IN_TG && !KEY && (!SESSION || INVITE)) loginScreen(); else load();
})();
</script>
<script>

(function () {

    zap: '<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',

    tag: '<path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.3"/>',
    clip: '<rect x="8" y="3" width="8" height="4" rx="1"/><path d="M8 5H6a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>',
    shelf: '<path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5l3.3-.9 3.2 15.6-3.3.9z"/>',

    cam: '<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M8 6l2-3h4l2 3"/><circle cx="12" cy="13" r="3.5"/>',
    shuffle: '<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
    link: '<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
    hash: '<path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/>',
    img: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',
    trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',

  var MAP = { '✅': 'check', '📦': 'box', '✈': 'truck', '🚚': 'truck', '🏠': 'home', '📅': 'cal', '📑': 'mark', '📖': 'book', '🤝': 'lend', '↩': 'undo',

    '🔍': 'search', '🔎': 'search', '🔗': 'link', '🔢': 'hash', '🖼': 'img', '🗑': 'trash', '🛒': 'cart', '🧾': 'receipt' };
  var RE = new RegExp('^(\\s*)(' + Object.keys(MAP).join('|') + ')\\uFE0F?\\s?');
  function fix(btn) {
    if (btn.hasAttribute('data-fc') || btn.closest('[data-noico]')) return;
    var w = document.createTreeWalker(btn, NodeFilter.SHOW_TEXT), t;
    while ((t = w.nextNode()) && !t.nodeValue.trim()) {}
    if (!t || t.parentNode.closest('svg')) return;
    var m = RE.exec(t.nodeValue); if (!m) return;
    // лише якщо емодзі — перше, що є в кнопці (без значка перед ним)
    var first = btn.firstElementChild; if (first && first.tagName === 'svg' && first.compareDocumentPosition(t) & 4) return;

<script>
/* Перевірка ширини: відкрий сайт з #ширина в кінці адреси — з'явиться табличка з розмірами й елементами, що вилазять за край вікна */
(function () {
  function show() {
    if (location.hash.indexOf('ширина') === -1 && location.hash.indexOf('%D1%88%D0%B8%D1%80%D0%B8%D0%BD%D0%B0') === -1 && location.hash !== '#w') return;
    var W = document.documentElement.clientWidth, out = [];
    document.querySelectorAll('body *').forEach(function (e) {
      var r = e.getBoundingClientRect();
      if (r.width && r.right > W + 1) out.push([Math.round(r.right), (e.tagName + '.' + String(e.className || '').split(' ').join('.')).slice(0, 40)]);
    });
    out.sort(function (a, b) { return b[0] - a[0]; });
    var m = document.querySelector('main'), b = document.body;
    var box = document.getElementById('wdbg') || document.body.appendChild(Object.assign(document.createElement('pre'), { id: 'wdbg' }));
    box.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:99;background:#fff;color:#000;font:12px/1.4 monospace;padding:8px;border:2px solid #c00;max-width:90vw;max-height:60vh;overflow:auto;white-space:pre-wrap';
    box.textContent = 'вікно ' + innerWidth + ' · html ' + document.documentElement.scrollWidth + ' · body ' + Math.round(b.getBoundingClientRect().width) + ' · main ' + (m ? Math.round(m.getBoundingClientRect().width) : '-') + ' · dpr ' + devicePixelRatio + ' · колонки ' + getComputedStyle(b).gridTemplateColumns + '\nзум ' + Math.round(outerWidth / innerWidth * 100) + '% · ' + navigator.userAgent.replace(/.*(Chrome\/[0-9]+).*/, '$1') + '\n' + (out.length ? out.slice(0, 12).map(function (x) { return x[0] + '  ' + x[1]; }).join('\n') : 'нічого не вилазить');
  }
  // ⌘K / Ctrl+K — пошук з клавіатури (на Windows підказка «Ctrl K»)
  if (!/Mac|iPhone|iPad/.test(navigator.platform || '')) document.querySelectorAll('.srch .sk').forEach(function (k) { k.textContent = 'Ctrl K'; });
  addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && (e.key === 'k' || e.key === 'K' || e.key === 'л' || e.key === 'Л')) { e.preventDefault(); var b = document.querySelector('.srch'); if (b) b.click(); }
  });
  // на комп'ютері: жест «розвести пальці» на тачпаді не збільшує сторінку (вона від цього їхала вбік); Cmd + / Cmd − працюють як завжди
  if (window.matchMedia('(min-width:1000px) and (pointer:fine)').matches) {
    addEventListener('wheel', function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
    ['gesturestart', 'gesturechange'].forEach(function (t) { addEventListener(t, function (e) { e.preventDefault(); }, { passive: false }); });
  }
  addEventListener('load', function () { setTimeout(show, 1500); });
  addEventListener('hashchange', show);
  addEventListener('resize', function () { setTimeout(show, 300); });
})();
</script>
