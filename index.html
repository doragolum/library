<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Моя бібліотека</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<script src="config.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7a4bd0">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Бібліотека">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>if ('serviceWorker' in navigator && location.protocol === 'https:' && !/script\.google/.test(location.host)) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });</script>
<style>
:root{--bg:#f6f4f1;--card:#fff;--ink:#22201d;--muted:#77716a;--line:#e7e2db;--accent:#7a4bd0;--accent-soft:#efe8fb;--ok:#2f8a4c;--ok-soft:#e3f3e8;--warn:#b5651d;--warn-soft:#fbecdc;--bad:#b3261e;--bad-soft:#fbe4e2;--wood:#9b6a3c;--wood-dark:#6e4626;--shelf-bg:#f1e6d8}
@media (prefers-color-scheme:dark){:root{--bg:#171615;--card:#22211f;--ink:#ece8e3;--muted:#a19a91;--line:#35322e;--accent:#b496f0;--accent-soft:#2e2640;--ok:#6fcf8f;--ok-soft:#1f3326;--warn:#e9a463;--warn-soft:#3a2b1c;--bad:#f08a82;--bad-soft:#3d2321;--wood:#7a5330;--wood-dark:#4d321b;--shelf-bg:#2a231d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px;padding:10px 16px 4px}
.top h1{font-size:18px;margin:0;flex:1}
.addbtn{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:6px 12px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:999px;font:inherit;white-space:nowrap;cursor:pointer;text-align:left}
.tab.on{background:var(--accent);color:#fff}
main{max-width:980px;margin:0 auto;padding:14px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;min-width:0}
h2{font-size:17px;margin:4px 0 10px}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;font:inherit;color:inherit}
.tile b{display:block;font-size:22px}
button.tile{cursor:pointer}
button.tile:hover{border-color:var(--accent)}
button.tile::after{content:"›";float:right;color:var(--muted);margin-top:-30px;font-size:18px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
input[type=search],select,.form input,.form select{width:100%}
input[type=search]{font-size:16px}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.sbox{position:relative;display:block;min-width:0}
.sbox input{width:100%;padding-right:40px}
.sclr{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:0}
.sbox input:placeholder-shown+.sclr{display:none}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;min-width:0}
.item:hover{border-color:var(--accent)}
.item .body{flex:1;min-width:0}
.item .pv{margin-left:auto;align-self:center;font-weight:600;white-space:nowrap;padding-left:6px}
.item .t{font-weight:600}
.thumb{width:40px;height:60px;border-radius:4px;object-fit:cover;flex:none;background:var(--line)}
.ph{width:40px;height:60px;border-radius:4px;flex:none;color:#fff;font-size:8px;line-height:1.1;padding:4px 3px;overflow:hidden;text-align:center;display:flex;align-items:center;justify-content:center}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--ink);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
.item .body{min-width:0}
.chip.a{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.w{background:var(--warn-soft);color:var(--warn)}
.chip.b{background:var(--bad-soft);color:var(--bad)}
a.chip,button.chip{cursor:pointer;border:0;font:inherit;font-size:12px;text-decoration:none}
.pick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pick button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.pick button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 13px;font:inherit;cursor:pointer}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hbars .r{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;margin:5px 0;font-size:14px}
.hbars .r span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbars .r .bar{margin:0}
.hbars .r .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
table.kv{width:100%;border-collapse:collapse}
table.kv td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-word}
table.kv td:first-child{color:var(--muted);width:42%;padding-right:10px}
.shelf{font-size:24px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:12px 14px;margin:8px 0 12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .sheet{background:var(--card);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 28px}
.modal .sheet.wide{max-width:900px}
.modal:not(.top) .sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:-8px auto 10px}
.modal.mid{align-items:flex-start;padding:9vh 16px 0}.modal.mid .sheet{border-radius:18px;max-width:420px}
.modal.top{align-items:flex-start}.modal.top .sheet{border-radius:0 0 18px 18px;max-height:85vh;padding-top:12px}
.ebar{position:sticky;bottom:-28px;margin:14px -16px -28px;padding:10px 16px 18px;background:var(--card);border-top:1px solid var(--line);z-index:2}
.ebar .row{gap:8px;align-items:center}.ebar input{min-width:0}
@media (min-width:700px){.modal{align-items:center}.modal.top{align-items:flex-start;padding-top:60px}.modal .sheet{border-radius:18px}}
.close{float:right;border:0;background:var(--line);color:var(--ink);border-radius:999px;width:32px;height:32px;font-size:18px;cursor:pointer;margin-left:8px}
.msg{padding:14px;border-radius:12px;background:var(--bad-soft);color:var(--bad)}
.note{padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:14px;margin-bottom:12px}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
.num{font-variant-numeric:tabular-nums}
.edits{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.edit span,.form label>span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(80px);opacity:0;visibility:hidden;pointer-events:none;transition:transform .2s,opacity .2s,visibility .2s;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;transition:transform .2s;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;pointer-events:auto;cursor:pointer}
.toast.bad{background:var(--bad);color:#fff}
.more{display:block;margin:10px auto 0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.stars{display:inline-flex;gap:2px}
.stars button{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;padding:0 1px;color:var(--line)}
.stars button.on{color:#f2b01e}
.bookhead{display:flex;gap:14px;align-items:flex-start}
.bookhead .cover{width:110px;height:165px;border-radius:8px;object-fit:cover;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.bookhead .ph{width:110px;height:165px;font-size:13px;border-radius:8px;padding:10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.form label{display:block;min-width:0}
.seg{display:flex;gap:6px}
.seg label{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;gap:6px;align-items:center}
.seg input{width:auto!important;margin:0}
.seg label.on{border-color:var(--accent);background:var(--accent-soft)}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px}
.cov{cursor:pointer;min-width:0}
.cov img,.cov .ph{width:100%;height:auto;aspect-ratio:2/3;border-radius:6px;object-fit:cover;box-shadow:0 1px 4px rgba(0,0,0,.18);font-size:12px;padding:8px}
.cov .ct{font-size:12px;font-weight:600;margin-top:5px;line-height:1.25;max-height:2.5em;overflow:hidden}
.cov .ca{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* шафа */
.case{max-width:100%;overflow:hidden;background:var(--shelf-bg);border:10px solid var(--wood);border-radius:6px;padding:0 8px;margin-bottom:14px}
.plank{padding-top:14px}
.plank h4{margin:0 0 4px;font-size:13px;display:flex;gap:8px;align-items:baseline}
.spines{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;padding:0 2px;min-height:60px;scrollbar-width:thin}
.spine{position:relative;flex:none;border-radius:2px 2px 0 0;color:#fbf6ec;font:600 11px/1.1 inherit;font-family:inherit;letter-spacing:.2px;padding:16px 2px 14px;overflow:hidden;cursor:pointer;border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.25),1px 0 0 rgba(0,0,0,.18);transition:transform .15s}
.spine::before,.spine::after{content:"";position:absolute;left:3px;right:3px;height:2px;background:rgba(255,226,170,.55);box-shadow:0 4px 0 rgba(255,226,170,.35)}
.spine::before{top:6px}.spine::after{bottom:9px;box-shadow:0 -4px 0 rgba(255,226,170,.35)}
.spine span,.mspine span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:100%;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.spine:hover{transform:translateY(-5px)}
.spine.read i{position:absolute;top:0;right:3px;width:6px;height:16px;background:#e9c46a;clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
.facing{display:flex;align-items:flex-end;gap:6px;overflow-x:auto;padding:0 2px 0;min-height:60px;scrollbar-width:thin}
.facing .fc{flex:none;width:72px;height:108px;border-radius:2px 4px 4px 2px;background:center/cover no-repeat;border:0;padding:0;cursor:pointer;box-shadow:inset 3px 0 0 rgba(0,0,0,.18),0 2px 4px rgba(0,0,0,.2);color:#fbf6ec;font:600 10px/1.15 inherit;font-family:inherit;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;position:relative;transition:transform .15s}
.facing .fc:hover{transform:translateY(-4px)}
.facing .fc span{padding:5px;font-size:9.5px;overflow-wrap:anywhere;hyphens:auto;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.facing .fc.read::after{content:"✓";position:absolute;right:3px;bottom:3px;width:16px;height:16px;border-radius:50%;background:#2e7d4f;color:#fff;font-size:10px;line-height:16px}
.board-floor{height:10px;background:var(--wood-dark);margin:0 -8px;border-radius:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;margin:6px 0 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
/* дошка бажанок */
.board{display:flex;gap:10px;overflow-x:auto;align-items:flex-start;padding-bottom:10px}
.col{flex:0 0 250px;background:var(--line);border-radius:12px;padding:8px;max-height:75vh;overflow-y:auto}
.col h4{margin:2px 4px 8px;font-size:13px;display:flex;justify-content:space-between}
.col .item{padding:8px;gap:8px}
.col .item .t{font-size:13px}
/* календар */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{font-size:12px;color:var(--muted);text-align:center}
.cal .d{min-height:74px;border-radius:8px;background:var(--bg);padding:3px;font-size:11px;position:relative;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal .d .n{color:var(--muted)}
.cal .d.today{outline:2px solid var(--accent)}
.cal .d.out{opacity:.35}
.cal .d .cv{display:flex;gap:2px;flex-wrap:wrap}
.cal .d img,.cal .d .ph{width:22px;height:33px;border-radius:2px;font-size:5px;padding:1px;cursor:pointer}
.cal .d .fin{position:absolute;top:2px;right:3px;color:var(--ok);font-weight:700}
.rec .why{font-size:12px;color:var(--accent)}
.chk{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--accent)}
.only-desk{display:none}
.tab svg{width:22px;height:22px;flex:none}
.tab{display:flex;align-items:center;gap:10px}
.subtabs{display:flex;background:var(--line);border-radius:12px;padding:3px;margin:0 0 14px;max-width:520px}
.subtabs button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;padding:8px 6px;border-radius:10px;cursor:pointer}
.subtabs button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 6px}
.qa button{border:0;border-radius:16px;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);padding:14px 6px;font:inherit;font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:84px;cursor:pointer}
.qa button svg{width:24px;height:24px;color:var(--accent)}
.qa button.p{background:var(--accent);color:#fff;box-shadow:none}
.qa button.p svg{color:#fff}
.need span{color:var(--warn);font-weight:600}.need input{border:2px solid var(--warn)!important}
.qa-hint{font-size:12px;color:var(--muted);text-align:center;margin-bottom:12px}
@media (max-width:999px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom));overflow:visible}
  .tab{flex-direction:column;gap:2px;border-radius:10px;font-size:11px;padding:4px 2px;text-align:center}
  .tab.on{background:transparent;color:var(--accent);font-weight:700}
  main{padding-bottom:96px}
  .toast{bottom:84px}
  .top{padding:8px 16px 6px}
  .top h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:19px}
  .addbtn .lbl{display:none}
  .addbtn{width:40px;height:40px;padding:0;font-size:22px;line-height:1}
  .top .iconbtn{width:40px;height:40px}
  main .selbar{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
}
/* широкий екран */
@media (min-width:1000px){
  body{display:grid;grid-template-columns:230px 1fr}
  header{height:100vh;border-bottom:0;border-right:1px solid var(--line);display:flex;flex-direction:column}
  .top{flex-direction:column;align-items:stretch;padding:18px 16px 10px}
  .tabs{flex-direction:column;overflow:visible;padding:6px 10px}
  .tab{padding:9px 14px;border-radius:10px}
  main{max-width:1500px;width:100%;min-width:0;padding:22px 28px 60px}
  .list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
  .cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
  .tiles{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  .covers{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .only-desk{display:block}
  .cal .d{min-height:96px}
  .cal .d img,.cal .d .ph{width:30px;height:45px}
}
.hd{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-bottom:8px}
.backb{border:0;background:var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .close{float:none;margin-left:auto}
.iconbtn{border:0;background:var(--line);color:var(--ink);border-radius:999px;width:34px;height:34px;font-size:15px;cursor:pointer;flex:none}
.bhero{position:relative;margin:-18px -16px 12px;padding:14px 16px;overflow:hidden;border-radius:18px 18px 0 0}
.bhero .bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(30px) saturate(1.5);opacity:.55;z-index:0}
.bhero>*{position:relative;z-index:1}
.bhero .shelf{background:rgba(255,255,255,.7)}
@media (prefers-color-scheme:dark){.bhero .shelf{background:rgba(0,0,0,.35)}}
.link{color:var(--accent);cursor:pointer;text-decoration:none;border-bottom:1px dashed currentColor}
.hero{background:linear-gradient(135deg,#2b2140,#5b3a9a);color:#fff;border-radius:16px;padding:16px;margin:0 0 12px;position:relative;overflow:hidden}
.hero h2{margin:0;color:#fff;font-size:21px}.hero .sub{opacity:.9;font-size:13px;margin-top:2px}
.hero .sub .link{color:#fff}
.hero .chips .chip{background:rgba(255,255,255,.18);color:#fff}
.hero .ava{float:right;width:56px;height:56px;border-radius:50%;background:#fff;color:#5b3a9a;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;margin-left:10px}
.hero .fan{float:right;display:flex;margin-left:10px}.hero .fan img,.hero .fan .ph{width:34px;height:51px;margin-left:-12px;border-radius:3px;box-shadow:-2px 2px 6px rgba(0,0,0,.35);font-size:0;padding:0}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.nums b{display:block;font-size:21px}.nums span{font-size:12px;color:var(--muted)}
.nums [data-list],.nums [data-go]{cursor:pointer}
.track{display:flex;gap:4px;margin-top:12px;flex-wrap:wrap}
.vol{flex:1 0 34px;text-align:center;font-size:11px;color:var(--muted);min-width:34px;max-width:70px}
.vol[data-book],.vol[data-wish]{cursor:pointer}
.vol i{display:block;height:30px;border-radius:6px;margin-bottom:3px;line-height:30px;font-style:normal;font-weight:600;color:#fff;font-size:12px}
.v-read{background:var(--ok)}.v-own{background:var(--accent)}.v-now{background:#e0a011}.v-wish{background:transparent;border:2px dashed var(--warn);color:var(--warn)!important;line-height:26px!important}.v-none{background:var(--line);color:var(--muted)!important}

  /* ---------- схожі у вас ---------- */
  function similar(b) {
    var g = b._g;
    return S.inLib.filter(function (x) { return x !== b && !(x.series && x.series !== '-' && norm(x.series) === norm(b.series)); }).map(function (x) {
      var sc = 0;
      if (x.author === b.author) sc += 5;
      if (x.genre && x.genre === b.genre) sc += 3;
      x._g.forEach(function (gg) { if (g.indexOf(gg) !== -1) sc += 1; });
      if (!isRead(x)) sc += 2;
      if (atHome(x)) sc += 1;
      if (x.type === 'Серія' && partNum(x.num) > 1) sc -= 3; // не пропонувати середину чужої серії
      return { x: x, sc: sc };
    }).filter(function (r) { return r.sc >= 6; }).sort(function (a, c) { return c.sc - a.sc || hashN(a.x.title + b.row) - hashN(c.x.title + b.row); }).slice(0, 10).map(function (r) { return r.x; });
  }

  function entityHits(q) {
    var words = norm(q).split(' ');
    var hit = function (v) { var n = norm(v); return words.every(function (w) { return n.indexOf(w) !== -1; }); };
    var authors = uniq(D.books.map(function (b) { return b.author; }).concat(D.wish.map(function (w) { return w.author; }))).filter(hit).slice(0, 8);

    if (a === 'vf-url' && vf) {
      var vx = vf.list[vf.i], vu = (fval('rv-url') || '').trim(), vi = (fval('rv-isbn') || '').replace(/[^0-9Xx]/g, ''), vs = {};
      if (vu) { if (!/^https?:\/\//i.test(vu)) return toast('Посилання має починатися з https://', true); vs.cover = vu; }
      if (vi) { if (vi.length !== 10 && vi.length !== 13) return toast('ISBN має 10 або 13 цифр', true); vs.isbn = vi; }
      if (!Object.keys(vs).length) return toast('Вставте посилання або ISBN', true);
      vfMark(vf.kind, vx); vf.i++; vfFetch(); vfDialog(); saveSet(vf.kind, vx, vs).then(function () { if (vf && modalStack && modalStack.fn === vfDialog) vfDialog(); }, function () {});
    }
    if (a === 'vf-save' && vf) {
      var sx = vf.list[vf.i], sr = vf.res[sx.row] || {}, rows = vfRows(sx, sr), set = {};
      document.querySelectorAll('[data-vf]').forEach(function (cb) { if (cb.checked) { var rw = rows[Number(cb.getAttribute('data-vf'))]; set[rw.f] = rw.theirs; } });
      if (!Object.keys(set).length) return vfNext(true);
      vfMark(vf.kind, sx); vf.i++; vfFetch(); vfDialog();
      saveSet(vf.kind, sx, set).then(function () { if (vf && modalStack && modalStack.fn === vfDialog) vfDialog(); }, function () {});
    }
    if (a === 'rv-skip' && rv) rvNext();
    if (a === 'rv-url' && rv) {
      var ux = rv.list[rv.i], uu = (fval('rv-url') || '').trim(), ui = (fval('rv-isbn') || '').replace(/[^0-9Xx]/g, ''), us = {};
      if (uu) {
        if (/^data:/i.test(uu)) return toast('Це вбудована мініатюра. Відкрийте картинку на сайті й скопіюйте її адресу (має починатися з https://).', true);
        if (!/^https?:\/\//i.test(uu)) return toast('Посилання має починатися з https://', true);
        us.cover = uu;
      }
      if (ui) { if (ui.length !== 10 && ui.length !== 13) return toast('ISBN має 10 або 13 цифр', true); us.isbn = ui; }
      if (!Object.keys(us).length) return toast('Вставте посилання або ISBN', true);
      rv.i++; rvFetch(); saveSet('library', ux, us);
    }
    if (a === 'rv-no' && rv) { var rx = rv.list[rv.i], rj = rvRejected(); rj[rx.author + '|' + rx.title] = 1; try { localStorage.setItem('lb.rej', JSON.stringify(rj)); } catch (e) {} rvNext(); }
    if (a === 'rv-yes' && rv) {
      var yx = rv.list[rv.i], yr = rv.res[yx.row] || {}, ys = {};
      var yi = String(yr.isbn || '').replace(/[^0-9Xx]/g, '');
      if (D.cols.isbn && !yx.isbn && (yi.length === 13 || yi.length === 10)) ys.isbn = yi;
      if (D.cols.cover && !yx.cover && yr.cover) ys.cover = yr.cover;
      if (!yx.pages && yr.pages) ys.pages = String(yr.pages);
      rv.i++; rvFetch();
      if (Object.keys(ys).length) saveSet('library', yx, ys); else reviewDialog();
    }
    if (a === 'cover-save' && b) { var cs = { cover: act.getAttribute('data-url') }; var ci = act.getAttribute('data-isbn').replace(/[^0-9Xx]/g, ''); if (D.cols.isbn && !b.isbn && (ci.length === 10 || ci.length === 13)) cs.isbn = ci; saveSet('library', b, cs); }
    if (a === 'cover-url' && b) { var u = fval('cover-url'); if (u) saveSet('library', b, { cover: u }); }
  });
  document.addEventListener('change', function (ev) {
    var mvs = ev.target.closest && ev.target.closest('[data-move]');
    if (mvs && mvs.value) { var mb = bookByRow(mvs.getAttribute('data-move')); if (mb) { moveDone[mb.row] = 1; saveSet('library', mb, { shelf: mvs.value }).then(function () { moveOpen(); }); } return; }
    var t = ev.target;
    if (t.hasAttribute('data-filter')) { view.f[t.getAttribute('data-filter')] = t.value; view.limit = 60; saveView(); render(); }
    if (t.hasAttribute('data-plan')) { var pb = bookByRow(t.getAttribute('data-plan')); if (pb) saveSet('library', pb, { plan: t.value }); return; }
    if (t.hasAttribute('data-sort')) { view.sort = t.value; saveView(); render(); }
    if (t.id && t.id.indexOf('f-') === 0) {
      if (t.id === 'f-lang') t.setAttribute('data-touched', '1');
      var nb = t.closest('.need'); if (nb && String(t.value).trim()) nb.classList.remove('need');
      if (t.id === 'f-author') applyAuthorDefaults();
    }
    if (t.id === 'f-type') document.getElementById('f-serbox').style.display = t.value === 'Серія' ? 'grid' : 'none';
    if (t.id === 'f-series') applySeriesDefaults();
    if (t.name === 'f-where') {
      document.querySelectorAll('.seg label').forEach(function (l) { l.className = l.querySelector('input').checked ? 'on' : ''; });
      document.getElementById('f-shelfbox').style.display = t.value === 'home' ? 'block' : 'none';
      document.getElementById('f-priobox').style.display = t.value === 'kyiv' ? 'block' : 'none';
      highlightNeeds();
    }
    if (t.hasAttribute('data-wdate')) {
      var wdp = t.getAttribute('data-wdate').split('|'), wdw = D.wish.filter(function (x) { return x.row === Number(wdp[1]); })[0];
      var wds = {}; wds[wdp[0]] = t.value ? dmy(t.value) : '';
      if (wdw) saveSet('wish', wdw, wds);
      return;
    }
    if (t.hasAttribute('data-date')) {
      var dp = t.getAttribute('data-date').split('|'), db = bookByRow(dp[1]);
      var ds = {}; ds[dp[0]] = t.value ? dmy(t.value) : '';
      if (db) saveSet('library', db, ds);
    }
    if (t.hasAttribute('data-edit')) {
      var p = t.getAttribute('data-edit').split('|');
      var arr = p[0] === 'library' ? D.books : D.wish;
      var item = arr.filter(function (x) { return x.row === Number(p[2]); })[0];
      if (!item) return;
      if (p[0] === 'library' && p[1] === 'status') return onStatusChange(item, t.value, t);
      if (p[0] === 'library' && p[1] === 'avail' && low(t.value) === 'позичена' && D.cols.lentTo) { nav = []; return lendDialog(item); }
      var set = {}; set[p[1]] = t.value;
      if (p[0] === 'library' && p[1] === 'place' && t.value !== 'Київ' && item.prio) set.prio = '';
      saveSet(p[0], item, set);
    }
  });
  // кнопка «📋 Вставити»: бере текст з буфера (iPhone покаже маленьке «Вставити» — натиснути його),
  // з тексту дістає ISBN (13 або 10 цифр), інакше вставляє як є
  function pasteInto(id) {
    var inp = document.getElementById(id);
    if (!inp) return;
    var put = function (txt) {
      var s = String(txt || '').trim(), m = s.replace(/[\s-]/g, '').match(/97[89]\d{10}|\d{9}[\dXx]/);
      inp.value = m ? m[0] : s;
      inp.dispatchEvent(new Event('input', { bubbles: true }));
    };
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(put, function () { inp.focus(); toast('Не вдалося прочитати буфер. Утримайте палець на полі ISBN → «Вставити».'); });
    } else { inp.focus(); toast('Утримайте палець на полі ISBN → «Вставити».'); }
  }
  // хрестик у полі пошуку: стирає текст і одразу оновлює результати
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest && ev.target.closest('.sclr');
    if (!b) return;
    ev.preventDefault(); ev.stopPropagation();
    var inp = b.parentNode.querySelector('input');
    if (!inp) return;
    inp.value = '';
    inp.focus();
    inp.dispatchEvent(new Event('input', { bubbles: true }));
  }, true);
  var timer = null;
  document.addEventListener('input', function (ev) {
    var t = ev.target, k = t.getAttribute('data-input');
    if (t.id && t.id.indexOf('f-') === 0) { var nb = t.closest('.need'); if (nb && String(t.value).trim()) nb.classList.remove('need'); var sm = t.closest('label') && t.closest('label').querySelector('.src'); if (sm) sm.textContent = ''; }
    if (!k) return;
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (k === 'gq') { view.q = t.value; document.getElementById('gres').innerHTML = globalResults(); return; }
      if (k === 'we-isbn') { var dg = t.value.replace(/[^0-9Xx]/g, ''); if (dg.length === 13 || dg.length === 10) wishLook(); return; }
      if (k === 'pq') { view.pq = t.value; var top = nav[nav.length - 1]; if (top) { top.fn.apply(null, top.args); var pi = document.querySelector('[data-input="pq"]'); if (pi) { pi.focus(); try { pi.setSelectionRange(pi.value.length, pi.value.length); } catch (e) {} } } return; }
      if (k === 'sq') { view.sq = t.value; var sr = document.getElementById('sres'); if (sr) sr.innerHTML = globalResults(view.sq) || '<p class="muted small">Почніть друкувати: шукаю серед книг, бажанок, авторів, серій, видавництв і полиць.</p>'; return; }
      if (k === 'bq') view.q = t.value;
      if (k === 'wq') view.wq = t.value;
      view.limit = 60;
      var pos = t.selectionStart;
      render();
      var again = document.querySelector('[data-input="' + k + '"]');
      if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) {} }
    }, 200);
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeModal(); if (ev.key === 'Enter' && ev.target.id === 'pg-val') { ev.preventDefault(); var sv = document.querySelector('[data-action="pg-save"]'); if (sv) sv.click(); } });

  /* ---------- картка знизу: потягнути вниз, щоб закрити ----------
     Закривається лише тоді, коли картка вже прокручена в самий верх і палець тягне вниз.
     Якщо ви внизу картки, свайп вниз просто прокручує її вгору — випадково не закриється. */
  var sheetDrag = null;
  document.addEventListener('touchstart', function (ev) {
    var sh = ev.target.closest && ev.target.closest('#modal .modal:not(.top) .sheet');
    if (!sh || ev.touches.length !== 1 || /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) { sheetDrag = null; return; }
    sheetDrag = { sh: sh, y: ev.touches[0].clientY, x: ev.touches[0].clientX, top: sh.scrollTop <= 0, dy: 0, on: false };
  }, { passive: true });
  document.addEventListener('touchmove', function (ev) {
    var d = sheetDrag;
    if (!d || !d.top) return;
    var dy = ev.touches[0].clientY - d.y, dx = Math.abs(ev.touches[0].clientX - d.x);
    if (!d.on) {
      if (dy < 8 || dx > dy) { if (dy < -4 || dx > 12) sheetDrag = null; return; }
      if (d.sh.scrollTop > 0) { sheetDrag = null; return; }
      d.on = true; d.sh.style.transition = 'none';
    }
    d.dy = Math.max(0, dy);
    d.sh.style.transform = 'translateY(' + d.dy + 'px)';
    if (ev.cancelable) ev.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', function () {
    var d = sheetDrag; sheetDrag = null;
    if (!d || !d.on) return;
    if (d.dy > 110) { d.sh.style.transition = 'transform .18s ease-in'; d.sh.style.transform = 'translateY(100%)'; suppressClick = Date.now(); setTimeout(closeModal, 170); }
    else { d.sh.style.transition = 'transform .2s'; d.sh.style.transform = ''; }
  });

  /* ---------- свайпи і довге натискання ---------- */
  var touch = null, lpTimer = null;
  function resetSwipe(el) { if (!el) return; el.style.transition = 'transform .2s, background .2s'; el.style.transform = ''; el.style.background = ''; setTimeout(function () { el.style.transition = ''; }, 220); }
  document.addEventListener('touchstart', function (ev) {
    var el = ev.target.closest('[data-book]');
    if (!el || ev.touches.length > 1 || ev.target.closest('select,input,textarea')) { touch = null; return; }
    var p = ev.touches[0];
    touch = { el: el, x: p.clientX, y: p.clientY, dx: 0, dy: 0, moved: false, swipe: el.classList.contains('item') };
    clearTimeout(lpTimer);
    lpTimer = setTimeout(function () {
      if (!touch || touch.moved) return;
      suppressClick = Date.now();
      try { if (window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred('medium'); else if (navigator.vibrate) navigator.vibrate(15); } catch (e) {}
      quickMenu(bookByRow(touch.el.getAttribute('data-book')));
      touch = null;
    }, 500);
  }, { passive: true });
  document.addEventListener('touchmove', function (ev) {
    if (!touch) return;
    var p = ev.touches[0];
    touch.dx = p.clientX - touch.x; touch.dy = p.clientY - touch.y;
    if (Math.abs(touch.dx) > 10 || Math.abs(touch.dy) > 10) { touch.moved = true; clearTimeout(lpTimer); }
    if (touch.swipe && Math.abs(touch.dx) > 12 && Math.abs(touch.dx) > Math.abs(touch.dy) * 1.5) {
      touch.el.style.transition = 'none';
      touch.el.style.transform = 'translateX(' + Math.max(-110, Math.min(110, touch.dx * .7)) + 'px)';
      touch.el.style.background = touch.dx > 0 ? 'var(--ok-soft)' : 'var(--accent-soft)';
    }
  }, { passive: true });
  document.addEventListener('touchend', function () {
    clearTimeout(lpTimer);
    if (!touch) return;
    var tc = touch; touch = null;
    resetSwipe(tc.el);
    if (tc.swipe && Math.abs(tc.dx) > 80 && Math.abs(tc.dx) > Math.abs(tc.dy) * 2) {
      suppressClick = Date.now();
      var sb = bookByRow(tc.el.getAttribute('data-book'));
      if (!sb) return;
      if (tc.dx > 0) swipeRight(sb); else quickMenu(sb);
    }
  });
  document.addEventListener('touchcancel', function () { clearTimeout(lpTimer); if (touch) resetSwipe(touch.el); touch = null; });
  document.addEventListener('contextmenu', function (ev) {
    var el = ev.target.closest('[data-book]');
    if (!el || ev.target.closest('select,input')) return;
    ev.preventDefault();
    if (Date.now() - suppressClick < 650) return;
    quickMenu(bookByRow(el.getAttribute('data-book')));
  });

  load();
})();
</script>
</body>
</html>
